<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pro · Web paneli</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0..1,0&display=block" rel="stylesheet">
<style>
:root{--bg:#fff;--side:#F7F8FC;--t:#16171A;--t2:#6C6E72;--t3:#A1A3A7;--sep:#E6E7EC;--a:#2F4BD1;--on:#fff;--pbg:#F2F4FF;--aSoft:#E8ECFF;--fill:#F3F4F6;--fill2:#E3E4E8;--red:#D6453D;--redSoft:#FBE7E5;
 --tb:#D2DBFF;--tbt:#1A2A80;--tg:#E8D4FB;--tgl:#8A3FD1;--tgt:#4A1A80;--to:#C6EEDD;--tol:#12A06B;--tot:#0B5A3C;--td:#FFDBBF;--tdl:#F07A1A;--tdt:#7A3A08;--shadow:0 10px 40px rgba(20,30,80,.10)}
:root[data-theme="dark"]{--bg:#000;--side:#0D0E12;--t:#F4F4F6;--t2:#9A9DA2;--t3:#6A6D72;--sep:#2A2A2D;--a:#7B8FF0;--on:#0B1030;--pbg:#141A33;--aSoft:rgba(123,143,240,.18);--fill:#1C1C1E;--fill2:#3A3A3D;--red:#FF6B61;--redSoft:rgba(255,107,97,.16);
 --tb:#1C2656;--tbt:#D5DCFF;--tg:#2E1C4A;--tgt:#EBDCFF;--to:#0F3A2B;--tot:#C8F5E3;--td:#45260E;--tdt:#FFE0C7;--shadow:0 10px 40px rgba(0,0,0,.5)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--t);font:450 14px/1.4 'Instrument Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea{font:inherit;color:var(--t)}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;line-height:1;display:inline-block;font-variation-settings:'FILL' 1,'wght' 500;-webkit-font-smoothing:antialiased;user-select:none}
:focus-visible{outline:2px solid var(--a);outline-offset:2px;border-radius:8px}

/* iskelet */
.app{display:grid;grid-template-columns:232px 1fr auto;height:100vh;overflow:hidden}
.side{background:var(--side);border-right:1px solid var(--sep);display:flex;flex-direction:column;padding:18px 12px 14px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 22px}
.brand i{width:32px;height:32px;border-radius:10px;background:var(--a);color:var(--on);display:flex;align-items:center;justify-content:center;font:700 13px 'Instrument Sans';font-style:normal;letter-spacing:-.04em}
.brand b{font-size:17px;font-weight:650;letter-spacing:-.02em}
.nav{display:flex;flex-direction:column;gap:2px}
.ni{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:10px;color:var(--t2);font-weight:550;font-size:14.5px;cursor:pointer;position:relative;width:100%;text-align:left}
.ni .ms{font-size:22px}
.ni:hover{background:var(--fill)}
.ni.on{background:var(--aSoft);color:var(--a)}
.ni .bd{margin-left:auto;min-width:20px;height:20px;border-radius:99px;background:var(--a);color:var(--on);font-size:11.5px;font-weight:650;display:flex;align-items:center;justify-content:center;padding:0 6px}
.nsep{height:1px;background:var(--sep);margin:12px 10px}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:var(--pbg);cursor:pointer}
.me b{display:block;font-size:14px;font-weight:600}.me span{display:block;font-size:12px;color:var(--t2)}
.me .qr{margin-left:auto;color:var(--a);display:flex}
.av{border-radius:99px;display:flex;align-items:center;justify-content:center;font-weight:650;flex:none;letter-spacing:-.01em}
.theme{display:flex;align-items:center;gap:8px;padding:8px 10px;margin-top:8px;font-size:12.5px;color:var(--t3);cursor:pointer;border-radius:10px}
.theme:hover{background:var(--fill)}

.main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.ph{display:flex;align-items:flex-end;gap:16px;padding:22px 28px 16px}
.ph h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.ph .sub{font-size:14px;color:var(--t2);margin-top:3px}
.ph .act{margin-left:auto;display:flex;align-items:center;gap:10px}
.seg{display:flex;background:var(--fill);border-radius:10px;padding:2px}
.seg button{padding:6px 14px;border-radius:8px;font-size:13px;font-weight:600;color:var(--t2)}
.seg button.on{background:var(--bg);color:var(--t);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.icb{width:36px;height:36px;border-radius:99px;background:var(--fill);display:flex;align-items:center;justify-content:center;color:var(--t)}
.icb .ms{font-size:22px}
.btn{height:40px;padding:0 16px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:14.5px;white-space:nowrap}
.btn .ms{font-size:20px}
.btn.p{background:var(--a);color:var(--on)}
.btn.o{box-shadow:inset 0 0 0 1px var(--sep)}
.btn.o .ms{color:var(--a)}
.btn.dl{color:var(--red);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--red) 35%,transparent)}
.btn:active{transform:scale(.98)}
.today{height:36px;padding:0 12px;border-radius:99px;background:var(--fill);font-weight:600;font-size:13px}

/* takvim */
.cal{flex:1;display:flex;flex-direction:column;min-height:0;padding:0 28px 0 0}
.dh{display:grid;grid-template-columns:64px repeat(7,1fr);border-bottom:1px solid var(--sep);padding-bottom:10px}
.dh div{text-align:center;cursor:pointer}
.dh small{display:block;font-size:12px;color:var(--t3);font-weight:600}
.dh b{display:inline-flex;width:34px;height:34px;border-radius:99px;align-items:center;justify-content:center;font-size:17px;font-weight:600;margin-top:4px}
.dh .td b{background:var(--a);color:var(--on)}
.dh .sel b{background:var(--t);color:var(--bg)}
.dh .off small,.dh .off b{color:var(--t3)}
.dh .dots{display:flex;gap:3px;justify-content:center;height:6px;margin-top:5px}.dh .dots i{width:6px;height:6px;border-radius:3px}
.grid{flex:1;overflow:auto;position:relative}
.gin{display:grid;grid-template-columns:64px repeat(7,1fr);position:relative}
.hr{height:60px;font-size:11px;font-weight:600;color:var(--t3);text-align:right;padding-right:12px;transform:translateY(-7px)}
.col{position:relative;border-left:1px solid var(--sep)}
.col.off{background:repeating-linear-gradient(135deg,transparent 0 6px,color-mix(in srgb,var(--fill2) 45%,transparent) 6px 7px)}
.hl{position:absolute;left:64px;right:0;height:1px;background:var(--sep)}
.ev{position:absolute;left:4px;right:4px;border-radius:9px;padding:6px 8px;overflow:hidden;cursor:pointer;border-left:3px solid;transition:box-shadow .15s,transform .15s}
.ev:hover{box-shadow:0 4px 14px rgba(20,30,80,.12)}
.ev.sel{outline:2px solid var(--a);outline-offset:1px}
.ev b{display:block;font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev span{display:block;font-size:11.5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.b{background:var(--tb);border-color:var(--a);color:var(--tbt)}.ev.g{background:var(--tg);border-color:var(--tgl);color:var(--tgt)}.ev.o{background:var(--to);border-color:var(--tol);color:var(--tot)}.ev.d{background:var(--td);border-color:var(--tdl);color:var(--tdt)}
.ev.br{background:repeating-linear-gradient(135deg,var(--fill) 0 6px,var(--bg) 6px 12px);border-color:var(--t3);color:var(--t2)}
.now{position:absolute;left:64px;right:0;height:2px;background:var(--t2);z-index:3;pointer-events:none}
.now::before{content:'12:36';position:absolute;left:-50px;top:-8px;font-size:10.5px;font-weight:700;color:var(--bg);background:var(--t2);padding:1px 6px;border-radius:99px}
.legend{display:flex;gap:16px;padding:10px 0 14px 64px;font-size:12.5px;color:var(--t2)}
.legend span{display:flex;align-items:center;gap:6px}.legend i{width:16px;height:5px;border-radius:3px}

/* sağ panel */
.rp{width:400px;border-left:1px solid var(--sep);display:flex;flex-direction:column;min-height:0;background:var(--bg);transition:width .3s cubic-bezier(.32,.72,0,1)}
.rph{display:grid;grid-template-columns:36px 1fr 36px;align-items:center;padding:18px 18px 8px;gap:8px}
.rph .t{text-align:center;font-size:17px;font-weight:600;color:var(--a)}
.rph .ok{background:var(--a);color:var(--on)}
.rpb{flex:1;overflow:auto;padding-bottom:20px}
.rpf{display:flex;gap:10px;padding:12px 18px 18px}
.rpf .btn{flex:1}
.sec{display:flex;align-items:flex-start;gap:12px;padding:14px 18px 10px}
.sec.c{align-items:center}
.rsi{width:32px;height:32px;border-radius:10px;background:var(--pbg);color:var(--a);display:flex;align-items:center;justify-content:center;flex:none}
.rsi .ms{font-size:19px}
.sec b{display:block;font-size:15px;font-weight:570}
.sec .st{display:block;font-size:12.5px;color:var(--t2);margin-top:2px}
.sdiv{height:0;border-top:1px solid var(--sep);margin:12px 18px 2px}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:0 18px}
.chip{padding:8px 0;border-radius:99px;background:var(--fill);text-align:center;font-size:13px;font-weight:570;cursor:pointer;color:var(--t)}
.chip.on{background:var(--a);color:var(--on)}
.chip .ms{font-size:16px;color:var(--a);vertical-align:-3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 18px}
.fld label{display:block;font-size:12.5px;font-weight:500;color:var(--t2);margin-bottom:5px}
.inp{width:100%;height:44px;border-radius:12px;border:1px solid var(--sep);background:transparent;padding:0 13px;font-size:15px;outline:none}
.inp:focus{border-color:var(--a)}
.vb{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--t3);font-size:13.5px;align-self:center;cursor:pointer;white-space:nowrap}
.vb .ms{color:var(--a);font-size:20px}
.tog{width:42px;height:25px;border-radius:99px;background:var(--fill2);position:relative;cursor:pointer;flex:none;align-self:center;margin-left:auto;transition:background .2s}
.tog::after{content:'';position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:99px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.tog.on{background:var(--a)}.tog.on::after{transform:translateX(17px)}
.gbox{margin:0 18px;border:1px solid var(--sep);border-radius:14px;overflow:hidden}
.grow{display:flex;align-items:center;gap:12px;padding:11px 12px}
.grow+.grow{border-top:1px solid var(--sep)}
.grow .k{flex:1;color:var(--t2);font-size:14px}
.grow .v{font-weight:570;font-size:14px}
.pkcard{margin:0 18px;border:1px solid var(--sep);border-radius:14px;padding:11px 12px;display:flex;align-items:center;gap:12px;cursor:pointer}
.pkc{width:40px;height:40px;border-radius:99px;background:var(--aSoft);color:var(--a);display:flex;align-items:center;justify-content:center;font-weight:650;flex:none}
.pkcard .rt{flex:1;min-width:0}.pkcard .rt b{display:block;font-size:15px;font-weight:570}.pkcard .rt span{font-size:12.5px;color:var(--a);font-weight:500}
.pkcard em{font-style:normal;font-weight:650;font-size:15px}

/* ders detayı üst blok */
.lh{background:var(--a);color:#fff;padding:18px 20px 20px;border-radius:0 0 22px 22px}
.lh .row{display:flex;align-items:center;justify-content:space-between}
.lh .cb{width:36px;height:36px;border-radius:99px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;color:#fff}
.lh small{display:block;font-size:13px;opacity:.85;margin-top:16px}
.lh h2{margin:2px 0 0;font-size:26px;font-weight:650;letter-spacing:-.02em}
.lh .pill{display:inline-flex;align-items:center;gap:5px;margin-top:12px;padding:5px 11px;border-radius:99px;background:rgba(255,255,255,.18);font-size:12.5px;font-weight:570}
.who{display:flex;align-items:center;gap:12px;margin:16px 18px 4px;padding:12px;border:1px solid var(--sep);border-radius:14px;cursor:pointer}
.who b{display:block;font-size:15px;font-weight:600}.who span{font-size:12.5px;color:var(--t2)}

/* özet paneli */
.sumc{margin:6px 18px 0;border-radius:18px;background:var(--pbg);padding:14px 16px}
.sumc b{display:block;font-size:30px;font-weight:650;letter-spacing:-.03em}
.sumc span{font-size:13px;color:var(--t2)}
.lrow{display:flex;align-items:center;gap:12px;padding:10px 18px;cursor:pointer}
.lrow:hover{background:var(--fill)}
.lrow .bar{width:3px;align-self:stretch;border-radius:2px}
.lrow b{display:block;font-size:14.5px;font-weight:570}.lrow span{font-size:12.5px;color:var(--t2)}
.lrow em{margin-left:auto;font-style:normal;font-size:13px;font-weight:600}
.req{display:flex;align-items:center;gap:12px;margin:0 18px 8px;padding:11px 12px;border-radius:14px;border:1px solid var(--sep);cursor:pointer}
.req b{display:block;font-size:14.5px;font-weight:570}.req span{font-size:12.5px;color:var(--t2)}
.req .ms{margin-left:auto;color:var(--a)}

/* kişiler */
.pp{flex:1;display:grid;grid-template-columns:340px 1fr;min-height:0;border-top:1px solid var(--sep)}
.pl{border-right:1px solid var(--sep);display:flex;flex-direction:column;min-height:0}
.srch{margin:14px 16px 8px;display:flex;align-items:center;gap:6px;height:38px;border-radius:10px;background:var(--fill);padding:0 10px;color:var(--t3)}
.srch input{flex:1;border:0;background:transparent;outline:none;font-weight:500;font-size:14.5px}
.fch{display:flex;gap:6px;padding:0 16px 8px;flex-wrap:wrap}
.fch .chip{padding:6px 12px}
.plist{flex:1;overflow:auto}
.prow{display:flex;align-items:center;gap:12px;padding:9px 16px;cursor:pointer}
.prow:hover{background:var(--fill)}
.prow.on{background:var(--aSoft)}
.prow b{display:block;font-size:14.5px;font-weight:570}.prow span{font-size:12.5px;color:var(--t2)}
.prow .tg{margin-left:auto;font-size:12px;font-weight:600;color:var(--t2)}
.prow .tg.r{color:var(--red)}
.pgl{font-size:12.5px;font-weight:600;color:var(--t3);padding:12px 16px 4px}
.pd{overflow:auto;padding:24px 32px}.pd>*{max-width:820px}
.pdh{display:flex;align-items:center;gap:16px}
.pdh h2{margin:0;font-size:24px;font-weight:650;letter-spacing:-.02em}
.pdh .ph2{font-size:14px;color:var(--a);font-weight:500;margin-top:2px}
.pdh .act{margin-left:auto;display:flex;gap:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px}
.stat{background:var(--fill);border-radius:14px;padding:12px 14px;display:flex;align-items:center;cursor:default}
.stat b{display:block;font-size:24px;font-weight:650;color:var(--a);letter-spacing:-.02em}
.stat span{font-size:12.5px;color:var(--t2)}
.stat.pk{background:var(--pbg)}
.stat .eye{margin-left:auto;color:var(--a);cursor:pointer}
.sgs{display:flex;gap:4px;margin-top:8px}.sgs i{flex:1;height:6px;border-radius:3px;background:color-mix(in srgb,var(--a) 14%,var(--bg))}.sgs i.m{background:var(--a)}
.hseg{margin-top:24px;display:inline-flex}
.lbox{display:flex;align-items:center;gap:12px;padding:11px 14px;border:1px solid var(--sep);border-radius:14px;margin-top:8px;cursor:pointer}
.lbox:hover{background:var(--fill)}
.lbox .bar{width:3px;height:30px;border-radius:2px}
.lbox b{display:block;font-size:14.5px;font-weight:550}.lbox span{font-size:12.5px;color:var(--t2)}
.lbox em{margin-left:auto;font-style:normal;font-weight:600}
.mh{font-size:13px;color:var(--t2);font-weight:500;margin-top:18px}

/* ödemeler */
.payh{padding:4px 28px 18px;display:flex;align-items:flex-end;gap:24px;border-bottom:1px solid var(--sep)}
.payh .big{font-size:40px;font-weight:650;letter-spacing:-.03em;line-height:1}
.payh .lab{font-size:13px;color:var(--t2);margin-top:4px}
.payh .pend{color:var(--red);font-weight:600}
.tbl{padding:8px 28px;overflow:auto;flex:1}
.tr{display:grid;grid-template-columns:2fr 1.4fr 1fr 1fr 120px;align-items:center;gap:12px;padding:12px 8px;border-bottom:1px solid var(--sep);cursor:pointer}
.tr:hover{background:var(--fill)}
.tr.th{font-size:12.5px;color:var(--t3);font-weight:600;cursor:default}.tr.th:hover{background:none}
.tr .n{display:flex;align-items:center;gap:10px;font-weight:570}
.tr .amt{font-weight:650;text-align:right}
.tr .r{color:var(--red)}

/* bildirimler */
.nl{max-width:720px;padding:0 28px;overflow:auto}
.nr{display:flex;align-items:center;gap:14px;padding:12px 10px;border-bottom:1px solid var(--sep);cursor:pointer;border-radius:10px}
.nr:hover{background:var(--fill)}
.nr b{display:block;font-size:15px;font-weight:600}.nr span{font-size:13px;color:var(--t2)}
.nr .tm{margin-left:auto;font-size:12.5px;color:var(--t3)}
.ngh{font-size:13px;font-weight:600;color:var(--t3);padding:16px 10px 4px}

/* ayarlar */
.sp{flex:1;display:grid;grid-template-columns:260px 1fr;min-height:0;border-top:1px solid var(--sep)}
.sn{border-right:1px solid var(--sep);padding:12px}
.sp .cont{overflow:auto;padding:8px 20px 30px;max-width:640px}
.rblue .chips{padding-left:62px}

.mon{flex:1;display:flex;flex-direction:column;min-height:0;padding:0 28px 0 28px}
.mh7{display:grid;grid-template-columns:repeat(7,1fr);font-size:12px;font-weight:600;color:var(--t3);padding-bottom:8px;border-bottom:1px solid var(--sep)}.mh7 div{padding-left:10px}
.mg{flex:1;display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:1fr;min-height:0;border-left:1px solid var(--sep)}
.mc{border-right:1px solid var(--sep);border-bottom:1px solid var(--sep);padding:6px 6px 4px;display:flex;flex-direction:column;gap:3px;overflow:hidden;cursor:pointer;min-height:0}
.mc:hover{background:color-mix(in srgb,var(--fill) 60%,transparent)}
.mc .md{font-size:13px;font-weight:600;width:26px;height:26px;border-radius:99px;display:flex;align-items:center;justify-content:center;margin-bottom:1px}
.mc.td .md{background:var(--a);color:var(--on)}
.mc.out .md,.mc.off .md{color:var(--t3)}.mc.out{cursor:default}.mc.out:hover{background:none}
.mc.off{background:repeating-linear-gradient(135deg,transparent 0 6px,color-mix(in srgb,var(--fill2) 45%,transparent) 6px 7px)}
.mev{font-size:11.5px;padding:2px 6px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:2.5px solid;cursor:pointer}
.mev b{font-weight:650;margin-right:4px}
.mev.b{background:var(--tb);border-color:var(--a);color:var(--tbt)}.mev.g{background:var(--tg);border-color:var(--tgl);color:var(--tgt)}.mev.o{background:var(--to);border-color:var(--tol);color:var(--tot)}.mev.d{background:var(--td);border-color:var(--tdl);color:var(--tdt)}
.more{font-size:11px;color:var(--t2);font-weight:600;padding-left:4px}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;background:var(--t);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;transition:all .25s;pointer-events:none;z-index:99}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:1280px){.app{grid-template-columns:232px 1fr}.rp{position:fixed;top:0;right:0;bottom:0;z-index:40;box-shadow:var(--shadow);width:400px}.rp:not(.ovl){display:none!important}}
@media (max-width:1100px){.app{grid-template-columns:72px 1fr auto}.side .lbl,.brand b,.me div,.me .qr,.theme span,.ni .bd{display:none}.ni{justify-content:center}.rp{width:360px}}
</style>
</head>
<body>
<div class="app">
 <aside class="side" aria-label="Ana menü">
  <div class="brand"><i>Pro</i><b>Pro</b></div>
  <nav class="nav" id="nav"></nav>
  <div class="me" data-toast="Profil açılıyor"><div class="av" style="width:36px;height:36px;background:#D7F0E3;color:#1E7A45;font-size:13px">DA</div><div><b>Deniz Arslan</b><span>Özel ders · İstanbul</span></div><span class="qr"><span class="ms">qr_code_2</span></span></div>

 </aside>

 <aside class="rp" id="rp" aria-label="Detay paneli"></aside>
</div>
<div class="toast" id="toast"></div>
<script>
const I=(n,s=22)=>`<span class="ms" style="font-size:${s}px">${n}</span>`;
const AVC=[['#E3E8FF','#2F4BD1'],['#EDE6FB','#7A3FD0'],['#D7F0E3','#1E7A45'],['#FBE5D6','#C9661C']];
const av=(ini,c=0,s=36)=>`<div class="av" style="width:${s}px;height:${s}px;background:${AVC[c%4][0]};color:${AVC[c%4][1]};font-size:${Math.round(s*.36)}px">${ini}</div>`;
const TY={b:['Bireysel','var(--a)'],g:['Grup','var(--tgl)'],o:['Online','var(--tol)'],d:['Deneme dersi','var(--tdl)']};
const PEOPLE=[['EY','Elif Yıldırım',0,'Aylık üyelik',''],['MK','Mert Kaya',1,'₺1.500 borç','r'],['DA','Deniz Arslan',2,'Tek ders',''],['ZA','Zeynep Aydın',3,'Üye',''],['CÖ','Can Öztürk',0,'8 derslik paket',''],['SD','Selin Demir',1,'Aylık',''],['BŞ','Burak Şahin',2,'Tek ders',''],['AK','Ayşe Koç',3,'Üye',''],['BA','Berk Aksoy',1,'Tek ders',''],['CY','Cansu Yılmaz',2,'Tek ders',''],['ÇE','Çağla Er',3,'Tek ders',''],['EK','Emre Kılıç',0,'Tek ders','']];
const DN=['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'],DATES=[7,8,9,10,11,12,13];
/* [gün, başlangıç saat, süre dk, tür, kişi index] */
const EVS=[[0,9,60,'b',0],[0,14,60,'o',2],[0,17.5,90,'g',5],[1,10.5,60,'b',4],[1,16,45,'d',8],[2,9,60,'b',0],[2,11.5,90,'g',1],[2,14,60,'o',2],[2,19,60,'g',5],[3,10,60,'b',3],[3,15,60,'b',6],[4,9,60,'o',9],[4,12,60,'g',7],[4,18,60,'d',10],[5,10,60,'b',4],[5,12,60,'b',11]];
const BRK=[[0,12.5,60,'Öğle molası'],[1,12.5,60,'Öğle molası'],[2,12.5,60,'Öğle molası'],[3,12.5,60,'Öğle molası'],[4,12.5,60,'Öğle molası']];
const H0=8,H1=21,HH=60;
const hm=x=>`${String(Math.floor(x)).padStart(2,'0')}:${String(Math.round(x%1*60)).padStart(2,'0')}`;
let calView='week',page='cal',selDay=2,selEv=null,rpMode='sum',selP=1;

const NAV=[['cal','calendar_today','Takvim'],['ppl','group','Kişiler'],['pay','receipt_long','Ödemeler'],['ntf','notifications','Bildirimler',2],null,['set','settings','Ayarlar']];
function drawNav(){document.getElementById('nav').innerHTML=NAV.map(n=>n?`<button class="ni${page==n[0]?' on':''}" data-page="${n[0]}">${I(n[1])}<span class="lbl">${n[2]}</span>${n[3]?`<span class="bd">${n[3]}</span>`:''}</button>`:'<div class="nsep"></div>').join('')}

/* ---------- sayfalar ---------- */
function pCal(){
 const hrs=[];for(let h=H0;h<=H1;h++)hrs.push(h);
 const top=x=>(x-H0)*HH;
 const cols=DN.map((d,i)=>{const evs=EVS.map((e,k)=>[e,k]).filter(([e])=>e[0]==i).map(([e,k])=>{const p=PEOPLE[e[4]];return `<div class="ev ${e[3]}${selEv===k?' sel':''}" data-ev="${k}" style="top:${top(e[1])+2}px;height:${e[2]/60*HH-4}px"><b>${p[1]}</b><span>${hm(e[1])} · ${TY[e[3]][0]}</span></div>`}).join('');
  const brs=BRK.filter(b=>b[0]==i).map(b=>`<div class="ev br" style="top:${top(b[1])+2}px;height:${b[2]/60*HH-4}px" data-toast="Mola düzenlenir"><b>${b[3]}</b><span>${hm(b[1])} – ${hm(b[1]+b[2]/60)}</span></div>`).join('');
  return `<div class="col${i==6?' off':''}" style="height:${(H1-H0+1)*HH}px">${evs}${brs}</div>`}).join('');
 return `<div class="ph"><div><h1>${calView=='week'?'Bu hafta':'Eylül 2026'}</h1><div class="sub">${calView=='week'?`7 – 13 Eylül · ${EVS.length} ders`:`${MEV.reduce((a,d)=>a+d.length,0)} ders`}</div></div><div class="act"><div class="seg"><button class="${calView=='week'?'on':''}" data-cv="week">Hafta</button><button class="${calView=='month'?'on':''}" data-cv="month">Ay</button></div><button class="btn o" data-rp="brk">${I('snooze')}Mola ekle</button><button class="btn p" data-rp="new">${I('add')}Ders ekle</button></div></div>
 ${calView=='month'?pMonth():`<div class="cal"><div class="dh"><div></div>${DN.map((d,i)=>{const ty=[...new Set(EVS.filter(e=>e[0]==i).map(e=>e[3]))];return `<div class="${i==2&&selDay!=2?'td':''}${i==selDay?' sel':''}${i==6?' off':''}" data-day="${i}"><small>${d}</small><b>${DATES[i]}</b><div class="dots">${ty.slice(0,3).map(t=>`<i style="background:${TY[t][1]}"></i>`).join('')}</div></div>`}).join('')}</div>
 <div class="grid" id="grid"><div class="gin">${hrs.map((h,k)=>`<div class="hl" style="top:${k*HH}px"></div>`).join('')}<div>${hrs.map(h=>`<div class="hr">${hm(h)}</div>`).join('')}</div>${cols}<div class="now" style="top:${top(12.6)}px"></div></div></div>
 <div class="legend">${Object.values(TY).map(t=>`<span><i style="background:${t[1]}"></i>${t[0]}</span>`).join('')}<span><i style="background:var(--t3)"></i>Mola</span></div></div>`}`}

/* ay görünümü: Eylül 2026 (1 Eylül Salı) */
const MEV=(()=>{const out=[];let h=12345;const r=()=>(h=(h*1103515245+12345)%2147483648)/2147483648;for(let d=1;d<=30;d++){const wd=(d+0)%7;/* 1 Eyl = Salı -> wd: 0=Pzt */const w=(d)%7;const dow=(1+d-1)%7;out.push([])}
 for(let d=1;d<=30;d++){const dow=(d+0)%7; /* Pzt=0: 1 Eyl Sal=1 */const dw=(d)%7;const day=(d-1+1)%7;const isSun=day==6;if(d>=7&&d<=13){out[d-1]=EVS.filter(e=>e[0]==d-7).map(e=>[e[1],e[3],e[4],EVS.indexOf(e)]);continue}if(isSun)continue;const n=day==5?1:1+Math.floor(r()*4);const hs=[9,10.5,12,14,16,17.5,19].sort(()=>r()-.5).slice(0,n).sort((a,b)=>a-b);out[d-1]=hs.map(x=>[x,'bgod'[Math.floor(r()*4)],Math.floor(r()*12),-1])}return out})();
function pMonth(){const cells=[];const lead=1;/* 1 Eyl Salı: Pzt boş */for(let i=0;i<lead;i++)cells.push(`<div class="mc out"><span class="md">31</span></div>`);
 for(let d=1;d<=30;d++){const day=(d-1+lead)%7,ev=MEV[d-1]||[],td=d==9;cells.push(`<div class="mc${day==6?' off':''}${td?' td':''}" data-mday="${d}"><span class="md">${d}</span>${ev.slice(0,3).map(e=>`<div class="mev ${e[1]}"${e[3]>=0?` data-ev="${e[3]}"`:' data-toast="Ders detayı"'}><b>${hm(e[0])}</b>${PEOPLE[e[2]][1].split(' ')[0]}</div>`).join('')}${ev.length>3?`<div class="more">+${ev.length-3} ders</div>`:''}</div>`)}
 while(cells.length%7)cells.push(`<div class="mc out"><span class="md">${cells.length-29}</span></div>`);
 return `<div class="mon"><div class="mh7">${DN.map(d=>`<div>${d}</div>`).join('')}</div><div class="mg">${cells.join('')}</div><div class="legend" style="padding-left:0">${Object.values(TY).map(t=>`<span><i style="background:${t[1]}"></i>${t[0]}</span>`).join('')}</div></div>`}
function pPpl(){const p=PEOPLE[selP],groups={};[...PEOPLE].map((x,i)=>[x,i]).sort((a,b)=>a[0][1].localeCompare(b[0][1],'tr')).forEach(([x,i])=>{const L=x[1][0];(groups[L]=groups[L]||[]).push([x,i])});
 const debt=p[4]=='r',pk=p[3].includes('paket');
 return `<div class="ph"><div><h1>Kişiler</h1><div class="sub">${PEOPLE.length} aktif kişi</div></div><div class="act"><button class="btn p" data-rp="newp">${I('person_add')}Kişi ekle</button></div></div>
 <div class="pp"><div class="pl"><div class="srch">${I('search',19)}<input placeholder="Kişi ara" aria-label="Kişi ara" id="pq"></div><div class="fch">${['Tümü','Üyeler','Bu hafta','Borçlu','Arşiv'].map((c,i)=>`<span class="chip${i?'':' on'}" data-fc>${c}</span>`).join('')}</div>
 <div class="plist">${Object.entries(groups).map(([L,arr])=>`<div class="pgl">${L}</div>`+arr.map(([x,i])=>`<div class="prow${i==selP?' on':''}" data-p="${i}">${av(x[0],x[2],36)}<div><b>${x[1]}</b></div><span class="tg${x[4]?' r':''}">${x[3]}</span></div>`).join('')).join('')}</div></div>
 <div class="pd"><div class="pdh">${av(p[0],p[2],64)}<div><h2>${p[1]}</h2><div class="ph2">+90 532 17 41 03</div></div><div class="act"><button class="btn o" data-rp="docs">${I('folder')}Dokümanlar</button><button class="btn p" data-rp="new">${I('add')}Ders ekle</button></div></div>
 <div class="stats"><div class="stat"><div><b>12</b><span>toplam ders</span></div></div><div class="stat" data-pend><div><b id="pend">***</b><span>bekleyen</span></div><span class="eye">${I('visibility',20)}</span></div>${pk?`<div class="stat pk" style="display:block"><div style="display:flex;align-items:center"><b>2</b><span style="margin-left:6px;color:var(--a);font-weight:570">ders kaldı</span><span style="margin-left:auto;color:var(--a);font-weight:600;cursor:pointer" data-toast="Paket yenileniyor">Yenile</span></div><div class="sgs">${[0,1,2,3,4,5,6,7].map(j=>`<i${j>5?' class="m"':''}></i>`).join('')}</div></div>`:`<div class="stat"><div><b>${debt?'2':'0'}</b><span>ödenmemiş ders</span></div></div>`}</div>
 <div class="seg hseg"><button class="on">Geçmiş</button><button>Gelecek</button></div>
 <div class="mh">Eylül</div>${lb('3 Eylül · 09:00','Bireysel · 60 dk','b','₺750',debt)}<div class="mh">Ağustos</div>${lb('27 Ağustos · 09:00','Bireysel · 60 dk','b','₺750',debt)}${lb('20 Ağustos · 09:00','Bireysel · 60 dk','b','₺750')}${lb('13 Ağustos · 09:00','Deneme dersi · 45 dk','d','Ücretsiz')}</div></div>`}
const lb=(d,t,ty,v,red)=>`<div class="lbox" data-ev="0"><span class="bar" style="background:${TY[ty][1]}"></span><div><b>${d}</b><span>${t}</span></div><em${red?' style="color:var(--red)"':v=='Ücretsiz'?' style="color:var(--t3)"':''}>${v}</em></div>`;

function pPay(){const r=(i,sub,amt,date,red)=>{const p=PEOPLE[i];return `<div class="tr"${red?' data-rp="pay"':''}><div class="n">${av(p[0],p[2],32)}${p[1]}</div><div style="color:${red?'var(--red)':'var(--t2)'}">${sub}</div><div style="color:var(--t2)">${date}</div><div style="color:var(--t2)">${red?'Bekliyor':'Tahsil edildi'}</div><div class="amt${red?' r':''}">${amt}</div></div>`};
 return `<div class="ph"><div><h1>Ödemeler</h1><div class="sub">Eylül 2026</div></div><div class="act"><button class="icb" aria-label="Önceki ay">${I('chevron_left')}</button><button class="icb" aria-label="Sonraki ay">${I('chevron_right')}</button><button class="btn p" data-rp="pay">${I('add')}Ödeme kaydet</button></div></div>
 <div class="payh"><div><div class="big">₺12.400</div><div class="lab">tahsil edildi</div></div><div><div class="big" style="font-size:24px;color:var(--red)">₺2.250</div><div class="lab"><span class="pend">bekliyor</span> · 2 kişi</div></div><div style="margin-left:auto" class="seg"><button class="on">Tümü</button><button>Ödenmemiş</button><button>Tahsil edilen</button></div></div>
 <div class="tbl"><div class="tr th"><div>Kişi</div><div>Açıklama</div><div>Tarih</div><div>Durum</div><div style="text-align:right">Tutar</div></div>${r(1,'2 ders · 6 gün gecikti','₺1.500','27 Ağu',1)}${r(6,'1 ders · vadesi yarın','₺750','10 Eyl',1)}${r(3,'Havale · aylık üyelik','₺5.400','10 Eyl')}${r(0,'Nakit · 4 ders','₺3.000','8 Eyl')}${r(4,'Havale · 8 derslik paket','₺2.500','5 Eyl')}${r(2,'Kart · 2 ders','₺1.500','3 Eyl')}</div>`}

function pNtf(){const n=(i,t,s,tm,rp)=>`<div class="nr" data-rp="${rp}">${av(PEOPLE[i][0],PEOPLE[i][2],40)}<div><b>${t}</b><span>${s}</span></div><span class="tm">${tm}</span></div>`;
 return `<div class="ph"><div><h1>Bildirimler</h1><div class="sub">2 rezervasyon talebi bekliyor</div></div><div class="act"><button class="btn o" data-page="set">${I('settings')}Bildirim ayarları</button></div></div>
 <div class="nl"><div class="ngh">Bugün</div>${n(6,'Yeni rezervasyon talebi','Burak Şahin · 12 Eyl 18:00','24 dk','req')}${n(7,'Talep çakışıyor','Ayşe Koç · grup dersiyle aynı saat','1 sa','reqc')}${n(0,'Yeni saat onaylandı','Elif Yıldırım · 12 Eyl 18:00','3 sa','ev0')}<div class="ngh">Bu hafta</div>${n(1,'Ödeme bekleniyor','Mert Kaya tarafından · ₺1.500','Pzt','pay')}${n(5,'Ders iptal edildi','Selin Demir · 8 Eyl 19:00','Pzt','ev2')}${n(4,'Paket bitmek üzere','Can Öztürk · 2 ders kaldı','Paz','pc4')}</div>`}

let setTab='rules';
function pSet(){const S=[['cal','schedule','Takvim ayarlarım'],['rules','gavel','Ders kuralları'],['pk','sell','Paket tercihleri'],['nt','notifications','Bildirim ayarları'],['acc','person','Hesap']];
 return `<div class="ph"><div><h1>Ayarlar</h1><div class="sub">Takvim, kurallar, paketler ve hesap</div></div></div>
 <div class="sp"><div class="sn">${S.map(s=>`<button class="ni${setTab==s[0]?' on':''}" data-set="${s[0]}">${I(s[1])}<span>${s[2]}</span></button>`).join('')}</div><div class="cont">${setBody()}</div></div>`}
const sec=(ic,t,st,r='',c)=>`<div class="sec${c||!st?' c':''}"><span class="rsi">${I(ic,19)}</span><div style="flex:1;min-width:0"><b>${t}</b>${st?`<span class="st">${st}</span>`:''}</div>${r}</div>`;
const cc=(arr,sel)=>`<div class="chips">${arr.map((x,i)=>`<span class="chip${i==sel?' on':''}" data-ch>${x}</span>`).join('')}<span class="chip" data-ch aria-label="Özel değer">${I('edit',16)}</span></div>`;
const sd='<div class="sdiv"></div>';
function setBody(){
 if(setTab=='rules')return `<div class="rblue">`+sec('event_available','Rezervasyon penceresi','Kişi dersten en geç kaç saat önce rezervasyon yapabilir')+cc(['1 sa','2 sa','24 sa'],1)+sd+sec('event_busy','Ücretsiz iptal süresi','Bu süreden sonraki iptallerde ders ücreti alınır')+cc(['2 sa','4 sa','24 sa'],1)+sd+sec('schedule','Ders başlama kademesi','Kişiler dersi hangi dakikalarda başlatabilir')+cc(['Tam saat','15 dk','30 dk'],0)+sd+sec('snooze','Ders arası mola','Bir ders bitince sonrakine kadar boşluk')+cc(['Yok','10 dk','15 dk'],2)+`</div>`;
 if(setTab=='cal')return sec('schedule','Çalışma saatleri','Her gün için varsayılan')+`<div class="two"><div class="fld"><label>Başlangıç</label><input class="inp" value="10:00"></div><div class="fld"><label>Bitiş</label><input class="inp" value="18:00"></div></div>`+sd+sec('snooze','Düzenli molalar','Her hafta tekrar eder',`<button class="icb" style="color:var(--a);margin-left:auto" aria-label="Mola ekle">${I('add')}</button>`)+`<div class="gbox">${[['Öğle molası','12:30 – 13:30 · Pzt – Cmt'],['Akşam arası','17:00 – 17:30 · Sal, Per']].map(b=>`<div class="grow"><span class="k" style="color:var(--t)"><b style="font-weight:570">${b[0]}</b><br><span style="font-size:12.5px;color:var(--t2)">${b[1]}</span></span>${I('chevron_right',20)}</div>`).join('')}</div>`+sd+sec('sync','Apple Takvim senkronu','Son senkron: 2 dk önce','<span class="tog on" data-tog></span>');
 if(setTab=='pk')return sec('person','Tekil ders','Tek seanslık dersler')+`<div class="gbox">${[['60 dk','Tek ders','Takvimde 90 dk · 15 dk mola','₺750'],['90 dk','Tek ders','Mola yok','₺1.125']].map(r=>`<div class="grow"><div class="pkc" style="font-size:12px">${r[0]}</div><span class="k" style="color:var(--t)"><b style="font-weight:570">${r[1]}</b><br><span style="font-size:12.5px;color:var(--t2)">${r[2]}</span></span><span class="v">${r[3]}</span></div>`).join('')}</div>`+sd+sec('stacks','Çoklu paket','Birden fazla seans, tek ödeme')+`<div class="gbox">${[['8×','8 derslik paket','ders başı ₺675 · 2 ay','₺5.400'],['12×','Aylık üyelik','ders başı ₺600 · 1 ay','₺7.200']].map(r=>`<div class="grow"><div class="pkc" style="background:var(--fill);color:var(--t)">${r[0]}</div><span class="k" style="color:var(--t)"><b style="font-weight:570">${r[1]}</b><br><span style="font-size:12.5px;color:var(--t2)">${r[2]}</span></span><span class="v">${r[3]}</span></div>`).join('')}</div>`;
 if(setTab=='nt')return sec('notifications','Anlık bildirimler','Hangi durumda haber verilsin')+`<div class="gbox">${['Rezervasyon talebi','Ödeme hareketi','İptal ve erteleme'].map(t=>`<div class="grow"><span class="k" style="color:var(--t)">${t}</span><span class="tog on" data-tog></span></div>`).join('')}<div class="grow"><span class="k" style="color:var(--t)">Ders hatırlatması</span><span class="vb">1 sa önce${I('chevron_right',20)}</span></div></div>`+sd+sec('bedtime','Sessiz saatler','Bu aralıkta sadece iptaller gelir','<span class="tog on" data-tog></span>');
 return `<div class="pdh" style="padding:16px 18px">${av('DA',2,64)}<div><h2>Deniz Arslan</h2><div class="ph2" style="color:var(--t2)">Özel ders · İstanbul</div></div></div>`+sec('public','Profil herkese açık','QR ile gelenler randevu alabilir','<span class="tog on" data-tog></span>')+sd+`<div style="padding:8px 18px"><button class="btn dl">Hesabı sil</button></div>`}

/* ---------- sağ panel ---------- */
const rph=(t,l='close',r='')=>`<div class="rph"><button class="icb" data-rp="sum" aria-label="Kapat">${I(l)}</button><div class="t">${t}</div>${r||'<span></span>'}</div>`;
function rpSum(){const td=EVS.filter(e=>e[0]==2);
 return `<div class="rph" style="grid-template-columns:1fr"><div style="font-size:20px;font-weight:650;letter-spacing:-.02em">Bugün</div></div>
 <div class="sumc"><b>${td.length} ders</b><span>9 Eylül Çarşamba · sıradaki 14:00</span></div>
 <div class="sec c" style="padding-top:18px">${'<span class="rsi">'+I('event_upcoming',19)+'</span>'}<div style="flex:1"><b>Bugünkü dersler</b></div></div>${td.map(e=>{const p=PEOPLE[e[4]],k=EVS.indexOf(e);return `<div class="lrow" data-ev="${k}"><span class="bar" style="background:${TY[e[3]][1]}"></span><div><b>${p[1]}</b><span>${hm(e[1])} · ${TY[e[3]][0]} · ${e[2]} dk</span></div><em${e[4]==1?' style="color:var(--red)"':''}>${e[4]==1?'Ödenmedi':''}</em></div>`}).join('')}
 ${sd}<div class="sec c">${'<span class="rsi">'+I('mark_email_unread',19)+'</span>'}<div style="flex:1"><b>Bekleyen talepler</b></div></div>
 <div class="req" data-rp="req">${av('BŞ',2,36)}<div><b>Burak Şahin</b><span>12 Eyl Cum · 18:00</span></div>${I('chevron_right',20)}</div><div class="req" data-rp="reqc">${av('AK',3,36)}<div><b>Ayşe Koç</b><span style="color:var(--red)">Grup dersiyle çakışıyor</span></div>${I('chevron_right',20)}</div>
 ${sd}<div class="sec c">${'<span class="rsi">'+I('payments',19)+'</span>'}<div style="flex:1"><b>Bekleyen ödemeler</b><span class="st">2 kişi · ₺2.250</span></div><span class="vb" data-page="pay">Tümü${I('chevron_right',20)}</span></div>`}
function rpEv(k){const e=EVS[k],p=PEOPLE[e[4]],paid=e[4]!=1;
 return `<div class="lh"><div class="row"><button class="cb" data-rp="sum" aria-label="Kapat">${I('close')}</button><span style="font-weight:600">Ders detayı</span><span style="width:36px"></span></div><small>${TY[e[3]][0]} · ${e[2]} dk</small><h2>${DN[e[0]]} ${DATES[e[0]]} Eyl · ${hm(e[1])} – ${hm(e[1]+e[2]/60)}</h2><span class="pill">${I('repeat',15)}Her hafta tekrarlanır</span></div>
 <div class="rpb"><div class="who" data-person="${e[4]}">${av(p[0],p[2],44)}<div style="flex:1"><b>${p[1]}</b><span>${p[3]}</span></div>${I('chevron_right',20)}</div>
 <div class="gbox" style="margin-top:12px"><div class="grow"><span class="k">Konum</span><span class="v" style="color:var(--a)">Kadıköy stüdyo ↗</span></div><div class="grow"><span class="k">Ücret</span><span class="v">₺750</span></div><div class="grow"><span class="k">Ödeme</span><span class="v" style="color:${paid?'var(--a)':'var(--red)'}">${paid?'Ödendi':'Ödenmedi'}</span></div></div>
 <div style="margin:14px 18px 0"><div style="font-size:12.5px;color:var(--t2);font-weight:500;margin-bottom:5px">Not</div><textarea class="inp" style="height:80px;padding:10px 13px;resize:none" placeholder="Bu derse not ekle"></textarea></div></div>
 <div class="rpf">${paid?'':`<button class="btn o" data-rp="pay">${I('payments')}Ödeme al</button>`}<button class="btn dl" data-toast="Ders iptal edildi">İptal et</button><button class="btn p" data-toast="Ertele ekranı açılır">Dersi ertele</button></div>`}
function rpNew(){return rph('Yeni ders','close',`<button class="icb ok" data-rp="sum" data-toast="Ders eklendi" aria-label="Ekle">${I('check')}</button>`)+`<div class="rpb">`+
 sec('group','Kişiler','',`<span class="vb" style="color:var(--t)">${av('EY',0,24)}Elif Yıldırım${I('chevron_right',20)}</span>`)+sd+sec('event','Zaman','')+`<div class="two"><div class="fld"><label>Tarih</label><input class="inp" value="10 Eylül Çar"></div><div class="fld"><label>Başlangıç</label><input class="inp" value="16:00"></div></div>`+
 sd+sec('payments','Ücret','Kişinin paketi varsa o, yoksa temel paket gelir')+`<div class="pkcard"><div class="pkc">8×</div><div class="rt"><b>8 derslik paket</b><span>Elif'in paketi · 5 ders kaldı</span></div><em>₺675</em>${I('chevron_right',20)}</div>`+
 sd+sec('location_on','Konum','Dersin yapılacağı yer','<span class="vb">Stüdyo'+I('chevron_right',20)+'</span>')+sd+sec('repeat','Tekrar','Her hafta · bitiş yok','<span class="vb">'+I('expand_more',22)+'</span>')+sd+sec('send','Kişiye bildir','Ders saati ve ücret onayına gider','<span class="tog on" data-tog></span>')+`</div>`}
function rpBrk(){return rph('Mola ekle','close',`<button class="icb ok" data-rp="sum" data-toast="Mola eklendi" aria-label="Ekle">${I('check')}</button>`)+`<div class="rpb">`+sec('calendar_month','Gün','Birden fazla seçebilirsin')+`<div class="chips" style="grid-template-columns:repeat(7,1fr)">${DN.map((d,i)=>`<span class="chip${i==2?' on':''}" style="border-radius:12px;${i==6?'opacity:.35;pointer-events:none':''}" data-ch><small style="display:block;font-size:11px;opacity:.75">${d}</small>${DATES[i]}</span>`).join('')}</div>`+sd+sec('schedule','Saat','')+`<div class="two"><div class="fld"><label>Başlangıç</label><input class="inp" value="12:30"></div><div class="fld"><label>Bitiş</label><input class="inp" value="13:00"></div></div>`+sd+sec('edit_note','Sebep','Takvimde bu isimle görünür','<span class="vb">Öğle arası'+I('chevron_right',20)+'</span>')+sd+sec('visibility','Sebebi kişiler görsün','Kapalıysa sadece dolu görünür','<span class="tog" data-tog></span>')+sd+sec('repeat','Tekrar','Tekrarlanmaz','<span class="vb">'+I('expand_more',22)+'</span>')+`</div>`}
function rpReq(c){const p=PEOPLE[c?7:6];return rph('Rezervasyon talebi')+`<div class="rpb"><div class="sumc" style="margin-top:8px"><div style="display:flex;align-items:center;gap:10px">${av(p[0],p[2],40)}<div style="flex:1"><div style="font-weight:600;font-size:15px">${p[1]}</div><span>${c?'Tam zamanlı üyelik':'Tek ders · 3 ders geçmişi'}</span></div><span style="color:var(--a);font-weight:570;font-size:12px">22 sa kaldı</span></div><b style="color:var(--a);font-size:26px;margin-top:12px">${c?'10 Eyl Çar · 11:30':'12 Eyl Cum · 18:00'}</b><span>Bireysel · 60 dk · Kadıköy stüdyo</span></div>`+
 (c?sec('event_busy','Bu saatte başka dersin var','Mert Kaya · Grup dersi · 11:30 – 13:00')+sd:'')+sec('payments','Ücret',c?'Üyelik kapsamında':'Ön ödeme alındı',`<span style="margin-left:auto;font-weight:650;align-self:center">${c?'Üyelik':'₺750'}</span>`)+sd+sec('chat_bubble','Kişinin notu','')+`<div style="padding:0 18px;font-size:14.5px;line-height:1.5">Sınavım var, mümkünse konu tekrarına ağırlık verebilir miyiz?</div></div><div class="rpf"><button class="btn dl" data-rp="sum" data-toast="Talep reddedildi">Reddet</button><button class="btn p" data-rp="sum" data-toast="Rezervasyon onaylandı">${c?'Yine de onayla':'Onayla'}</button></div>`}
function rpPay(){const p=PEOPLE[1];return rph('Ödeme al')+`<div class="rpb"><div style="text-align:center;padding:10px 18px 4px">${av(p[0],p[2],44).replace('class="av"','class="av" style="margin:0 auto"')}<div style="font-size:13px;color:var(--t2);margin-top:8px">${p[1]} · 2 ders</div><div style="font-size:34px;font-weight:650;letter-spacing:-.03em">₺1.500</div><span style="display:inline-block;margin-top:8px;padding:4px 11px;border-radius:99px;background:var(--redSoft);color:var(--red);font-size:12px;font-weight:570">6 gün gecikmiş</span></div>`+sd+sec('credit_card','Ödeme yöntemi','')+`<div class="chips" style="grid-template-columns:repeat(3,1fr)">${['Nakit','Havale','Kart'].map((x,i)=>`<span class="chip${i==1?' on':''}" data-ch style="border-radius:14px;padding:12px 0">${x}</span>`).join('')}</div>`+sd+sec('receipt_long','Makbuz gönder','WhatsApp ile','<span class="tog on" data-tog></span>')+`</div><div class="rpf"><button class="btn p" data-rp="sum" data-toast="₺1.500 tahsil edildi">₺1.500 tahsil et</button></div>`}
function rpDocs(){const p=PEOPLE[selP],dr=(ic,c,t,s)=>`<div class="grow" style="cursor:pointer"><span style="width:36px;height:36px;border-radius:10px;background:color-mix(in srgb,${c} 12%,transparent);color:${c};display:flex;align-items:center;justify-content:center">${I(ic,19)}</span><span class="k" style="color:var(--t)"><b style="font-weight:570">${t}</b><br><span style="font-size:12.5px;color:var(--t2)">${s}</span></span>${I('chevron_right',20)}</div>`;
 return `<div class="rph"><button class="icb" data-rp="sum" aria-label="Kapat">${I('close')}</button><div style="text-align:center"><div style="color:var(--a);font-size:17px;font-weight:600">${p[1]}</div><div style="font-size:11.5px;color:var(--t3)">Dokümanlar</div></div><button class="icb" style="color:var(--a)" aria-label="Doküman ekle" data-toast="Dosya seç">${I('add')}</button></div><div class="rpb">`+sec('description','Dosyalar','Paylaştığın ve yüklediğin belgeler')+`<div class="gbox">${dr('picture_as_pdf','#D6453D','Beslenme programı.pdf','1,2 MB · 28 Ağu')}${dr('image','#2F4BD1','Ölçüm sonuçları.jpg','840 KB · 20 Ağu')}${dr('draw','#8A3FD1','Onam formu.pdf','İmzalı · 13 Ağu')}</div>`+sd+sec('edit_note','Ders notları','Derslerden sonra aldığın notlar')+`<div class="gbox">${dr('sticky_note_2','#F07A1A','3 Eylül dersi','Konu tekrarı yapıldı')}${dr('sticky_note_2','#F07A1A','27 Ağustos dersi','Hedefler belirlendi')}</div></div>`}
function rpNewP(){return rph('Yeni kişi','close',`<button class="icb ok" data-rp="sum" data-toast="Kişi eklendi" aria-label="Kaydet">${I('check')}</button>`)+`<div class="rpb"><div class="two" style="margin-top:8px"><div class="fld"><label>Ad</label><input class="inp" placeholder="Ad"></div><div class="fld"><label>Soyad</label><input class="inp" placeholder="Soyad"></div></div><div style="padding:12px 18px 0" class="fld"><label>Telefon</label><input class="inp" placeholder="+90 5•• ••• ••••"></div><div style="padding:12px 18px 0" class="fld"><label>E-posta</label><input class="inp" placeholder="İsteğe bağlı"></div>`+sd+sec('sell','Özel paket tanımla','Bu kişiye özel fiyat veya paket','<span class="tog" data-tog></span>')+`</div>`}

function render(){drawNav();const m=document.getElementById('main');m.innerHTML={cal:pCal,ppl:pPpl,pay:pPay,ntf:pNtf,set:pSet}[page]();const rp=document.getElementById('rp');
 const show=page=='cal'||rpMode!='sum';rp.style.display=show?'':'none';rp.classList.toggle('ovl',rpMode!='sum');
 if(show)rp.innerHTML=rpMode=='sum'?rpSum():rpMode=='new'?rpNew():rpMode=='brk'?rpBrk():rpMode=='req'?rpReq(0):rpMode=='reqc'?rpReq(1):rpMode=='pay'?rpPay():rpMode=='docs'?rpDocs():rpMode=='newp'?rpNewP():rpMode.startsWith('ev')?rpEv(+rpMode.slice(2)):rpSum();
 if(page=='cal'){const g=document.getElementById('grid');if(g&&!g.dataset.s){g.scrollTop=(9-H0)*HH-10}}}
let tt;function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),1800)}
document.addEventListener('click',e=>{const x=e.target;let c;
 if(c=x.closest('[data-page]')){page=c.dataset.page;if(page!='cal')selEv=null;rpMode='sum';render();return}
 if(c=x.closest('[data-cv]')){calView=c.dataset.cv;render();return}
 if(c=x.closest('[data-mday]')&&!x.closest('[data-ev]')&&!x.closest('[data-toast]')){calView='week';render();return}
 if(c=x.closest('[data-tog]')){c.classList.toggle('on');return}
 if(c=x.closest('[data-ch]')){c.parentElement.querySelectorAll('.chip').forEach(z=>z.classList.toggle('on',z===c));return}
 if(c=x.closest('[data-fc]')){c.parentElement.querySelectorAll('.chip').forEach(z=>z.classList.toggle('on',z===c));return}
 if(c=x.closest('[data-pend]')){const b=document.getElementById('pend'),on=b.textContent=='***',debt=PEOPLE[selP][4]=='r';b.textContent=on?(debt?'₺1.500':'₺0'):'***';b.style.color=on&&debt?'var(--red)':'';c.querySelector('.eye').innerHTML=I(on?'visibility_off':'visibility',20);return}
 const tst=x.closest('[data-toast]');
 if(c=x.closest('[data-ev]')){const k=+c.dataset.ev;selEv=k;rpMode='ev'+k;if(page!='cal'&&!c.classList.contains('lbox')&&!c.classList.contains('lrow'))page='cal';const g=document.getElementById('grid'),st=g?g.scrollTop:0;render();const g2=document.getElementById('grid');if(g2){g2.dataset.s=1;g2.scrollTop=st}return}
 if(c=x.closest('[data-person]')){page='ppl';selP=+c.dataset.person;rpMode='sum';render();return}
 if(c=x.closest('[data-rp]')){let m=c.dataset.rp;if(m.startsWith('ev')){selEv=+m.slice(2);page='cal'}if(m.startsWith('pc')){page='ppl';selP=+m.slice(2);m='sum'}if(m=='sum')selEv=null;rpMode=m;const g=document.getElementById('grid'),st=g?g.scrollTop:0;render();const g2=document.getElementById('grid');if(g2){g2.dataset.s=1;g2.scrollTop=st}if(tst)toast(tst.dataset.toast);return}
 if(c=x.closest('[data-p]')){selP=+c.dataset.p;rpMode='sum';const pl=document.querySelector('.plist'),st=pl?pl.scrollTop:0;render();const p2=document.querySelector('.plist');if(p2)p2.scrollTop=st;return}
 if(c=x.closest('[data-day]')){selDay=+c.dataset.day;const g=document.getElementById('grid'),st=g.scrollTop;render();const g2=document.getElementById('grid');g2.dataset.s=1;g2.scrollTop=st;return}
 if(c=x.closest('[data-set]')){setTab=c.dataset.set;render();return}
 if(tst){toast(tst.dataset.toast)}
});
document.addEventListener('input',e=>{if(e.target.id=='pq'){const q=e.target.value.toLocaleLowerCase('tr');document.querySelectorAll('.prow').forEach(r=>r.style.display=r.textContent.toLocaleLowerCase('tr').includes(q)?'':'none')}});
document.getElementById('theme').onclick=()=>{const d=document.documentElement,on=d.dataset.theme=='dark';d.dataset.theme=on?'':'dark';document.querySelector('#theme span:last-child').textContent=on?'Koyu tema':'Açık tema'};
render();
</script>
